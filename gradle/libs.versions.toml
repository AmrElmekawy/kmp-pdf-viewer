# Latest stable versions as of 2026-10-11, taken from:
#   kotlin               https://kotlinlang.org/docs/releases.html
#   compose-multiplatform https://github.com/JetBrains/compose-multiplatform/releases
#   agp / compileSdk     https://developer.android.com/build/releases/gradle-plugin
#   gradle (wrapper)     https://gradle.org/releases/
#   coroutines           https://github.com/Kotlin/kotlinx.coroutines/releases
#   dokka                https://github.com/Kotlin/dokka/releases
#   vanniktech-publish   https://github.com/vanniktech/gradle-maven-publish-plugin/releases
#   ktlint-gradle        https://github.com/JLLeitschuh/ktlint-gradle/releases
[versions]
kotlin = "2.4.21"
compose-multiplatform = "1.12.1"
agp = "9.4.0"
coroutines = "1.11.0"
dokka = "2.2.0"
vanniktech-publish = "0.37.0"
ktlint-gradle = "14.2.0"
androidx-activity = "1.11.0"
androidx-test-runner = "1.7.0"
androidx-test-ext-junit = "1.3.0"

android-compileSdk = "37"
android-minSdk = "24"

[libraries]
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-runtime-saveable = { module = "org.jetbrains.compose.runtime:runtime-saveable", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose-multiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
vanniktech-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech-publish" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
