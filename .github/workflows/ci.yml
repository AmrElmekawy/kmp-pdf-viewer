name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # macOS runs everything: Android host tests, iOS simulator tests, lint, ktlint, and ABI checks.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      - name: Check (tests, iOS simulator tests, lint, ktlint, ABI)
        run: ./gradlew check

      - name: API docs
        run: ./gradlew :pdfviewer:dokkaGenerate

      - name: Publish to Maven Local
        run: ./gradlew :pdfviewer:publishToMavenLocal

      - name: Build the iOS sample
        run: >
          xcodebuild -project sample/iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build

# Android device tests (real PdfRenderer) run manually before each release:
#   ./gradlew :pdfviewer:connectedAndroidDeviceTest
